<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{{ page.title }} | {{ site.author.name }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <a class="site-name" href="{{ site.baseurl }}/">Khim Cathleen Saddi<span>.</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="{{ site.baseurl }}/#research">Research</a>
            <a href="{{ site.baseurl }}/#work">Projects</a>
            <a href="{{ site.baseurl }}/#publications">Publications</a>
            <a href="{{ site.baseurl }}/#education">Education</a>
            <a href="{{ site.baseurl }}/memberships">Communities &amp; Collaboration</a>
            <a href="{{ site.baseurl }}/#contact">Contact</a>
        </nav>
    </header>

    <main id="main-content">
        {{ content }}
    </main>

    <footer class="site-footer">
        <span>© {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
        <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </footer>
</body>
</html>
